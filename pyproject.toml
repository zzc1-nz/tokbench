[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokbench"
version = "0.1.0"
description = "Benchmark LLM token consumption and cost across models and prompt strategies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tokbench" }]
keywords = ["llm", "benchmark", "tokens", "cost", "observability", "evals"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
panel = ["streamlit>=1.32", "plotly>=5.20", "pandas>=2.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
all = ["tokbench[panel,dev]"]

[project.scripts]
tokbench = "tokbench.cli:main"

[project.urls]
Homepage = "https://github.com/zzc1-nz/tokbench"
Repository = "https://github.com/zzc1-nz/tokbench"
Issues = "https://github.com/zzc1-nz/tokbench/issues"

[tool.setuptools.packages.find]
include = ["tokbench*"]

# The HTML renderer is pure Python (inline SVG, no template files) and the panel
# is plain modules, so there is no non-Python package data to ship. Kept explicit
# so a future template directory has an obvious place to be registered.
[tool.setuptools.package-data]
tokbench = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Ruff also formats Python embedded in Markdown, but rewriting documentation code
# samples to satisfy a formatter is backwards: the README is prose, and its
# snippets are illustrative. Lint/format the source tree only.
extend-exclude = ["README.md", "docs/*.md", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
